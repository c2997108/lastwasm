<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>LAST-JS Homology Search</title>
  <script>
    const coiReloadKey = 'lastjs-coi-reload';
    if (crossOriginIsolated) {
      sessionStorage.removeItem(coiReloadKey);
    } else if (location.protocol !== 'file:' && 'serviceWorker' in navigator) {
      let reloadStarted = false;
      const reloadForIsolation = () => {
        if (reloadStarted || crossOriginIsolated || sessionStorage.getItem(coiReloadKey)) return;
        reloadStarted = true;
        sessionStorage.setItem(coiReloadKey, '1');
        location.reload();
      };
      navigator.serviceWorker.addEventListener('controllerchange', reloadForIsolation);
      navigator.serviceWorker.register('./coi-serviceworker.js')
        .then(() => navigator.serviceWorker.ready)
        .then(reloadForIsolation)
        .catch(() => {});
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #d8dee8;
      --text: #20242c;
      --muted: #5f6978;
      --accent: #0b6f6a;
      --accent-dark: #07534f;
      --mono-bg: #10141d;
      --mono-text: #dbe4f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 24px auto 40px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
    }

    .version {
      font-weight: 500;
      white-space: nowrap;
    }

    fieldset {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      margin: 0 0 16px;
      padding: 16px;
    }

    legend {
      padding: 0 6px;
      font-weight: 700;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 600;
    }

    input[type="file"],
    input[type="number"],
    input[type="text"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 7px 9px;
      font: inherit;
    }

    input:disabled {
      background: #eef1f5;
      color: #7a8492;
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    pre {
      min-height: 120px;
      max-height: 340px;
      overflow: auto;
      margin: 0;
      border-radius: 6px;
      background: var(--mono-bg);
      color: var(--mono-text);
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre;
    }

    .result-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .result-actions button {
      min-height: 34px;
      padding: 5px 11px;
      white-space: nowrap;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(120px, 180px) minmax(160px, auto) auto;
      gap: 12px;
      align-items: end;
      margin-top: 10px;
    }

    .checkbox {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin: 0;
      font-weight: 500;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
    }

    #status {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      color: var(--muted);
      font-weight: 600;
    }

    #dotplot {
      width: 100%;
      height: min(62vw, 560px);
      min-height: 360px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    @media (max-width: 820px) {
      main {
        width: min(100vw - 20px, 1180px);
        margin-top: 14px;
      }

      .row,
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>LAST-JS Homology Search <span id="appVer" class="small version"></span></h1>

    <div class="row">
      <fieldset>
        <legend>Input</legend>
        <label for="refFasta">Reference FASTA (X axis)</label>
        <input type="file" id="refFasta" accept=".fa,.fasta,.fna,.faa,.txt" />

        <label for="qryFasta">Query FASTA (Y axis)</label>
        <input type="file" id="qryFasta" accept=".fa,.fasta,.fna,.faa,.txt" />

        <label for="lastdbArgs">lastdb options</label>
        <input type="text" id="lastdbArgs" />

        <label for="lastalArgs">Search options</label>
        <input type="text" id="lastalArgs" value="-m100" placeholder="-m100" />

        <div class="controls">
          <div>
            <label for="workerCount">Threads</label>
            <input type="number" id="workerCount" min="1" step="1" />
          </div>

          <label class="checkbox">
            <input type="checkbox" id="safeMode" checked />
            <span>LAST defaults</span>
          </label>

          <button id="runBtn">Run</button>
        </div>
        <div id="status" class="small" aria-live="polite"></div>
        <div id="timeEstimate" class="small" aria-live="polite"></div>
      </fieldset>

      <fieldset>
        <legend>Log</legend>
        <pre id="log"></pre>
      </fieldset>
    </div>

    <fieldset>
      <legend>Result (TAB)</legend>
      <div class="result-actions">
        <span id="tabSummary" class="small"></span>
        <button id="downloadTabBtn" type="button" disabled>Download TAB</button>
      </div>
      <pre id="tab"></pre>
    </fieldset>

    <fieldset>
      <legend>Dot Plot</legend>
      <div id="dotplot"></div>
    </fieldset>
  </main>

  <script async src="https://cdn.plot.ly/plotly-2.27.0.min.js" crossorigin="anonymous"></script>
  <script>
    if (location.protocol !== 'file:') {
      const script = document.createElement('script');
      script.type = 'module';
      script.src = './web/main.js?v=20260724-plot-profile';
      document.body.appendChild(script);
    } else {
      document.querySelector('#status').textContent = 'Open this page through a local HTTP server.';
    }
  </script>
</body>

</html>
